description: >
  GEOS-ESM gfortran docker executor with regression test data

parameters:
  resource_class:
    description: "Resource class to use"
    default: large
    type: string
  baselibs_version:
    description: "Version of Baselibs to use"
    default: v8.33.0
    type: string
  regression_version:
    description: "Version of regression data to use"
    default: v1.0.0
    type: string

docker:
  - image: gmao/ubuntu24-geos-env-regression:<< parameters.baselibs_version >>-openmpi_5.0.5-gcc_15.2.0-regression_<< parameters.regression_version >>
    auth:
      username: $DOCKERHUB_USER
      password: $DOCKERHUB_AUTH_TOKEN

environment:
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  OMPI_MCA_btl_vader_single_copy_mechanism: none
  MPIEXEC_PREFLAGS: --oversubscribe
  LOCAL_REGRESSION_DATA_DIR: /regression-data

resource_class: << parameters.resource_class >>
